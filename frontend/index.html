<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- L-4: Restrict Referer header to origin-only on cross-origin navigation so
         sensitive tokens in query parameters are not leaked to third-party servers. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- BLACKFORGE: nombre, iconos y manifiesto de BlackForge Print (public/blackforge/) -->
    <title>BlackForge Print</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Impresiones del taller BlackForge en las impresoras Bambu Lab" />
    <meta name="theme-color" content="#110f0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BlackForge" />

    <!-- Manifest -->
    <link rel="manifest" href="/blackforge/manifest.json" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/blackforge/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/blackforge/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/blackforge/icons/apple-touch-icon.png" />

    <!-- Splash screens for iOS -->
    <link rel="apple-touch-startup-image" href="/blackforge/icons/android-chrome-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration (skip on SpoolBuddy kiosk).
         Kept as an external file so the CSP `script-src 'self'` covers it
         without needing 'unsafe-inline' or per-build hashes. -->
    <script src="/sw-register.js"></script>
  </body>
</html>
